<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Duelo Laser</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121214;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      margin-bottom: 10px;
    }
    .score-board {
      font-size: 24px;
      margin-bottom: 15px;
      display: flex;
      gap: 40px;
      font-weight: bold;
    }
    canvas {
      border: 3px solid #323238;
      background-color: #1e1e24;
      border-radius: 8px;
    }
    .controls {
      margin-top: 15px;
      font-size: 15px;
      color: #a8a8b3;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>Duelo Laser 2P</h1>
  <div class="score-board">
    <span style="color: #00e676;">Jogador 1: <span id="p1Score">0</span></span>
    <span style="color: #ff5252;">Jogador 2: <span id="p2Score">0</span></span>
  </div>

  <canvas id="gameCanvas" width="800" height="400"></canvas>

  <div class="controls">
    <p><strong>Jogador 1 (Azul):</strong> W = Sobe, S = Desce, Espaço = Atira </p>
    <p><strong>Jogador 2 (Vermelho):</strong> Seta Cima = Sobe, Seta Baixo = Desce, Enter = Atira</p>
    <p style="color: #ffd700; margin-top: 5px;"><strong>Obstáculo Cinza:</strong> Surge no meio da arena, bloqueia tiros e reaparece em novas posições!</p>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const p1ScoreEl = document.getElementById('p1Score');
    const p2ScoreEl = document.getElementById('p2Score');

    let p1Score = 0;
    let p2Score = 0;

    const player1 = {
      x: 30,
      y: 180,
      width: 20,
      height: 50,
      color: '#139ff0',
      speed: 5,
      lastShotTime: 0
    };

    const player2 = {
      x: 750,
      y: 180,
      width: 20,
      height: 50,
      color: '#ff5252',
      speed: 5,
      lastShotTime: 0
    };

    // Cooldown de 1 segundo (1000ms)
    const SHOT_COOLDOWN = 500;

    // Obstáculo bloqueador
    const obstacle = {
      x: 0,
      y: 0,
      width: 30,
      height: 50,
      color: '#8b8d9b',
      active: false
    };

    const keys = {};
    const bullets = [];

    // Gerenciador do ciclo do obstáculo
    function spawnObstacle() {
      // Posição aleatória na região central (entre os 2 jogadores)
      obstacle.x = Math.floor(Math.random() * (500 - 270 + 1)) + 270;
      obstacle.y = Math.floor(Math.random() * (canvas.height - obstacle.height));
      obstacle.active = true;

      // O obstáculo fica ativo por 5 segundos
      setTimeout(() => {
        obstacle.active = false;
        // Espera 2 segundos após sumir para gerar outro
        setTimeout(spawnObstacle, 2000);
      }, 5000);
    }

    // Inicia a primeira chamada do obstáculo após 2 segundos de jogo
    setTimeout(spawnObstacle, 2000);

    window.addEventListener('keydown', (e) => {
      if ([' ', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
        e.preventDefault();
      }

      keys[e.key] = true;
      const now = Date.now();

      // Tiro do Jogador 1 (Espaço) com Cooldown
      if ((e.key === ' ' || e.key === 'Spacebar') && (now - player1.lastShotTime >= SHOT_COOLDOWN)) {
        bullets.push({
          x: player1.x + player1.width,
          y: player1.y + player1.height / 2 - 3,
          width: 16,
          height: 6,
          speedX: 50,
          color: '#00e676',
          owner: 1
        });
        player1.lastShotTime = now;
      }

      // Tiro do Jogador 2 (Enter) com Cooldown
      if (e.key === 'Enter' && (now - player2.lastShotTime >= SHOT_COOLDOWN)) {
        bullets.push({
          x: player2.x - 16,
          y: player2.y + player2.height / 2 - 3,
          width: 16,
          height: 6,
          speedX: -50,
          color: '#ff5252',
          owner: 2
        });
        player2.lastShotTime = now;
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    function update() {
      // Movimento do Jogador 1 (W / S)
      if ((keys['w'] || keys['W']) && player1.y > 0) {
        player1.y -= player1.speed;
      }
      if ((keys['s'] || keys['S']) && player1.y + player1.height < canvas.height) {
        player1.y += player1.speed;
      }

      // Movimento do Jogador 2 (Seta Cima / Seta Baixo)
      if (keys['ArrowUp'] && player2.y > 0) {
        player2.y -= player2.speed;
      }
      if (keys['ArrowDown'] && player2.y + player2.height < canvas.height) {
        player2.y += player2.speed;
      }

      // Atualiza Posição dos Tiros
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.speedX;

        // Remove tiros fora da tela
        if (b.x < 0 || b.x > canvas.width) {
          bullets.splice(i, 1);
          continue;
        }

        // Colisão com o Obstáculo Bloqueador
        if (
          obstacle.active &&
          b.x + b.width >= obstacle.x &&
          b.x <= obstacle.x + obstacle.width &&
          b.y + b.height >= obstacle.y &&
          b.y <= obstacle.y + obstacle.height
        ) {
          bullets.splice(i, 1);
          continue;
        }

        // Colisão: Jogador 1 acerta Jogador 2
        if (
          b.owner === 1 &&
          b.x + b.width >= player2.x &&
          b.y + b.height >= player2.y &&
          b.y <= player2.y + player2.height
        ) {
          p1Score++;
          p1ScoreEl.textContent = p1Score;
          bullets.splice(i, 1);
        }
        // Colisão: Jogador 2 acerta Jogador 1
        else if (
          b.owner === 2 &&
          b.x <= player1.x + player1.width &&
          b.y + b.height >= player1.y &&
          b.y <= player1.y + player1.height
        ) {
          p2Score++;
          p2ScoreEl.textContent = p2Score;
          bullets.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Desenha Jogador 1
      ctx.fillStyle = player1.color;
      ctx.fillRect(player1.x, player1.y, player1.width, player1.height);

      // Desenha Jogador 2
      ctx.fillStyle = player2.color;
      ctx.fillRect(player2.x, player2.y, player2.width, player2.height);

      // Desenha Obstáculo (se estive ativo)
      if (obstacle.active) {
        ctx.fillStyle = obstacle.color;
        ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
        // Borda reflexiva para destacar o obstáculo
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
      }

      // Desenha Tiros
      bullets.forEach((b) => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.width, b.height);
      });
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
